server:
  port: 8989


spring:
  application:
    name: GATEWAY-SERVICE
  config:
    import: configserver:http://localhost:9196
  cloud:
    gateway:
      mvc:
        routes:
          - id: order-service
            uri: http://localhost:9179/
            predicates:
              - Path=/order/**
          - id: payment-service
            uri: http://localhost:9180/
            predicates:
              - Path=/payment/**
              
              
management:
  tracing:
    sampling:
      probability: 1.0