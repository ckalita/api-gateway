server:
  port: 8989


spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:9196
  cloud:
    gateway:
      mvc:
        routes:
          - id: order-service
            uri: http://localhost:9179/
            predicates:
              - Path=/order/**
          - id: payment-service
            uri: http://localhost:9180/
            predicates:
              - Path=/payment/**

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  file:
    name: /Users/dhunc2_mac/eclipse-workspaceNew/observability/log/api-gateway.log
              
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true	

